# jev-api — бэкенд (Кассандра ИИ-чат + cybergod-телеметрия/алерты). ОТДЕЛЬНЫЙ compose, чтобы
# базовый статик-деплой не зависел от секретов. Проект jevbest. Одна сеть. НИКОГДА --remove-orphans.
# Секреты и метки — из /opt/jevbest/.env (переиспользованы с дроплета из colt — python jev.py api).
services:
  jev-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: jev-api:latest
    container_name: jev-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE: jev-web                     # метка события — как «Colt Web», но service=jev-web
      CADDY_LOG: /logs/caddy.jsonl         # тейлим access-лог jev-web
      EVENTS_LOG: /coltevents/events.log   # пишем evt=http туда, где их берёт colt-promtail → Loki
      GEOIP_DIR: /data
      # активный аптайм-мониторинг (watchdog.py): пробим свой статик и общий эдж по SNI из appnet.
      WATCHDOG_ENABLED: "1"
      WATCHDOG_INTERVAL: "60"                  # период проб, сек
      WATCHDOG_INTERNAL_URL: http://jev-web:8080/__whoami
      WATCHDOG_EDGE_HOST: videodead-caddy-1    # общий эдж-Caddy в той же сети appnet
      WATCHDOG_SNI: jev.best
      CERT_WARN_DAYS: "14"                     # алерт, если до конца TLS-серта осталось меньше
    networks: [appnet]
    # ВАЖНО: как colt-assessbot/colt-cassandra — БЕЗ user:, т.е. root В КОНТЕЙНЕРЕ. Общий том
    # colt_events (events.log) принадлежит root (боты colt пишут туда root'ом); под uid 1000
    # jev-api не мог дописывать events.log и телеметрия молча пропадала (emit() глотает ошибку) —
    # сайт жив, а Grafana пустая. Контейнер всё равно жёсткий: cap_drop ALL + no-new-privileges,
    # наружу торчит только /api/* через jev-web. Это 1:1 как боты cybergod (они тоже root).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=32m
    volumes:
      - /opt/jevbest/logs:/logs:ro         # читаем caddy.jsonl (jev-web пишет)
      - coltevents:/coltevents             # общий журнал событий colt (его тейлит colt-promtail)
      - jevdata:/data                      # geoip mmdb (лениво качается, переживает редеплой)
    mem_limit: 320m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  appnet:
    external: true
    name: videodead_appnet
volumes:
  coltevents:
    external: true
    name: ${COLT_EVENTS_VOLUME:-colt-stack_colt_events}
  jevdata: {}
